[project]
name = "zkmaos-research-agent"
version = "0.1.0"
description = "연구조사 자동화 멀티 에이전트"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
extract = ["pymupdf>=1.24", "trafilatura>=1.10"]
vector = ["chromadb>=0.5"]
dev = ["pytest>=8", "ruff>=0.5"]
