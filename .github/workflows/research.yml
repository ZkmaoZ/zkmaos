name: research

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "조사 주제"
        required: true
        type: string
      per_domain:
        description: "도메인별 최대 결과 수"
        required: false
        default: "5"
      no_llm:
        description: "LLM 없이 (검색·폴백만)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # 매주 월요일 09:00 KST = 00:00 UTC
    - cron: "0 0 * * 1"

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .[extract]

      - name: 주제 결정
        id: topic
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            echo "value=${{ inputs.topic }}" >> "$GITHUB_OUTPUT"
          else
            # schedule 트리거 시 기본 주제 (config/scheduled-topics.txt 의 첫 줄)
            TOPIC=$(head -n 1 config/scheduled-topics.txt 2>/dev/null || echo "LLM 에이전트 평가 벤치마크 동향")
            echo "value=$TOPIC" >> "$GITHUB_OUTPUT"
          fi

      - name: 리서치 실행
        env:
          NO_LLM: ${{ inputs.no_llm }}
        run: |
          ARGS=()
          if [ "$NO_LLM" = "true" ]; then ARGS+=(--no-llm); fi
          ARGS+=(--per-domain "${{ inputs.per_domain || 5 }}")
          python -m agents.run "${{ steps.topic.outputs.value }}" "${ARGS[@]}" \
            | tee /tmp/run.out
          REPORT=$(tail -n 1 /tmp/run.out)
          echo "report=$REPORT" >> "$GITHUB_ENV"

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: research-report
          path: |
            reports/**/*.md
            storage/zkmaos.db

      - name: 결과 Issue 게시
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.report;
            const body = fs.readFileSync(path, 'utf8');
            const topic = `${{ steps.topic.outputs.value }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[research] ${topic} (${new Date().toISOString().slice(0,10)})`,
              body: body.length > 60000 ? body.slice(0, 60000) + "\n\n… (잘림)" : body,
              labels: ["research", "auto"],
            });
